<!DOCTYPE html>
<html lang="en">
  <head>

  <body>
    
    <header>
      <h1>Empereur, citoyen, esclave</h1>

    <main>
      <!-- this section tag will group everything related to player profiles -->
      <section id="players-section"> 

          <h2>players profile</h2>
          <!-- the form will contain the inputs needed to create the  profiles -->
          <form id="player-form">
            <!-- for entering the nickname -->
            <label for = "nickname">Nickname:</label>
            <input type="text" id="nickname" name="nickname" placeholder="Enter your nickname" required />
            <label for="avatar">choose an Avatar:</label>
            <!-- and in here i will choose the avatar for selection -->
            <select id = "avatar" name="avatar" required>
              <option value="assets/images/avatars/dragon.jpg">dragon</option>
              <option value="assets/images/avatars/knight.jpg">knight</option>   
              <option value="assets/images/avatars/wizard.jpg">wizard</option>
            </select>
            <!-- for form submission -->
             <p id="error-message" ></p>
            <button type="submit">create profile</button>
            </form>
            <div id = "players-list">
                      <!-- the profiless  (dsplaying them ) -->
              </div>
      </section>
      </main>
<script type="module" src="src/main.js"></script>
   </body>
